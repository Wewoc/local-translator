# ─────────────────────────────────────────
#  LocalTranslate – Konfiguration
# ─────────────────────────────────────────

# Ollama
ollama_url: "http://localhost:11434"
ollama_model: "translategemma:12b"          # z.B. mistral, llama3.1, phi3, gemma2

# DeepL (optional – API Key in .env eintragen)
deepl_free_tier: true            # true = Free API (api-free.deepl.com)
                                 # false = Pro API (api.deepl.com)

# LibreTranslate (self-hosted oder libretranslate.com)
libretranslate_url: "http://localhost:5000"
libretranslate_api_key: ""       # leer = kein Key (self-hosted ohne Auth)
libretranslate_enabled: false

# Chunking
ollama_chunk_size: 6000          # chars per chunk für Ollama
                                 # DeepL: 4900 / MyMemory: 480 (beide intern fest)

# MyMemory
mymemory_enabled: true
mymemory_email: ""               # optional: higher daily limit

# Lara Translate (https://laratranslate.com – Credentials in .env eintragen)
lara_enabled: true
lara_daily_limit: 5000           # Zeichen pro Tag (Free Tier = 5000)

# Übersetzungs-Einstellungen
default_source_lang: "DE"
default_target_lang: "EN"
debounce_seconds: 1.5            # seconds of typing pause before auto-translation triggers
default_mode: "manual"           # startup translation mode: debounce | sentence | manual
default_mindset: "general"       # startup mindset: general | technical | legal | medical | editorial | academic | marketing | political

# Multi-LLM Pipeline (optional)
pipeline_s2_model: ""            # quality/terminology pass — empty = disabled (e.g. "qwen2.5:7b")
pipeline_mindset_model: "phi4-mini:latest"       # mindset detection — empty = falls back to active S1 model (e.g. "phi4-mini:latest")

# Unterstützte Sprachen (Anzeigename: API-Code)
# Russisch/Chinesisch/Japanisch bewusst raus: translategemma (und die meisten
# offenen Ollama-Modelle allgemein) sind primär auf westliche/lateinschriftliche
# Sprachen trainiert und optimiert — kyrillische/CJK-Qualität ist unklar bis
# unterdurchschnittlich. Vor einem Wiedereinbau mit dem Batch-Testrunner
# (local_translator/test/) an echten Texten gegenprüfen.
languages:
  Deutsch: "DE"
  Englisch: "EN"
  Französisch: "FR"
  Spanisch: "ES"
  Italienisch: "IT"
  Portugiesisch (PT): "PT-PT"
  Portugiesisch (BR): "PT-BR"
  Niederländisch: "NL"
  Polnisch: "PL"

# Export
export_dir: "exports"            # Ordner für MD-Exporte (wird auto-erstellt)
filename_prefix: "translation"   # Dateiname-Präfix: translation_source.md / translation_target.md

# Logging
log_dir: "logs"                  # Ordner für Performance-Log (wird auto-erstellt)
log_csv_separator: ";"           # Trennzeichen für perf.csv — ";" für Excel/DE, "," für EN

# Server
host: "127.0.0.1"
port: 8000
auto_open_browser: true          # Browser automatisch öffnen beim Start
